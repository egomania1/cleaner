name: CI

on:
  push:
    branches: [winui, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Clean.sln

      - name: Build (warnings are errors)
        run: dotnet build Clean.sln --no-restore -c Release

      - name: Test
        run: dotnet test Clean.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Check for vulnerable packages
        shell: bash
        run: |
          dotnet list Clean.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "A package has a known vulnerability."
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults

  license-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the licence server
        working-directory: website/server
        run: node --test

      - name: Test the static site
        working-directory: website/site
        run: node --test
